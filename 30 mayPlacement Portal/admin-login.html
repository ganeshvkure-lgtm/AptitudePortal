<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin · aptitude portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { 
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            deep: { 950: '#0B0B12', 900: '#13131C', 800: '#1E1E2A' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
          },
        }
      }
    }
  </script>

  <style>
    /* Smooth entrance animations */
    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Subtle Animated Background Grid */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(148, 163, 184, 0.15) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Dark mode refinements */
    .dark body {
      background-color: #0B0B12;
    }
    .dark .bg-white {
      background-color: #16161F !important;
    }
    .dark .border-slate-200 {
      border-color: #2A2A37 !important;
    }
    .dark .text-slate-500 {
      color: #8A8A9E !important;
    }
    .dark .text-slate-600 {
      color: #B0B0C0 !important;
    }
    
    /* Input focus styles */
    input:focus {
      outline: none;
      ring: 2px solid #3b82f6;
    }
    
    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
  </style>
</head>

<body class="bg-soft-50 dark:bg-[#0B0B12] text-slate-900 dark:text-slate-200 min-h-screen flex flex-col font-sans transition-colors duration-300 relative overflow-x-hidden antialiased">

  <div class="absolute inset-0 z-[-1] bg-grid-pattern [mask-image:linear-gradient(to_bottom,white,transparent)] dark:[mask-image:linear-gradient(to_bottom,black,transparent)] pointer-events-none"></div>
  <div class="fixed top-20 -left-20 w-80 h-80 bg-blue-200/30 dark:bg-blue-800/20 rounded-full blur-[120px] z-[-1] animate-float"></div>
  <div class="fixed bottom-20 -right-20 w-96 h-96 bg-indigo-200/30 dark:bg-indigo-800/20 rounded-full blur-[140px] z-[-1]" style="animation-delay: -3s;"></div>

  <!-- Minimal Navigation -->
  <nav class="sticky top-4 z-50 max-w-7xl mx-auto w-[calc(100%-2.5rem)] px-5 py-3 rounded-2xl bg-white/70 dark:bg-[#16161F]/80 backdrop-blur-xl border border-white/30 dark:border-[#2A2A37]/80 shadow-sm">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
        <span class="text-xl font-semibold tracking-tight">
          <span class="bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">aptitude</span>
          <span class="text-slate-500 dark:text-slate-500 font-light mx-1">/</span>
          <span class="text-sm font-medium text-slate-500 dark:text-slate-400">admin</span>
        </span>
      </div>
      <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-full bg-white dark:bg-[#1E1E2A] border border-slate-200 dark:border-[#353542] text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#262633] text-sm font-medium shadow-sm transition-all flex items-center gap-1 active:scale-95">
        <span>←</span> back
      </button>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center p-4 md:p-8">
    
    <div class="fade-up w-full max-w-md">
      
      <!-- Card Container -->
      <div class="bg-white/60 dark:bg-[#16161F]/70 backdrop-blur-sm border border-slate-200/60 dark:border-[#2A2A37]/80 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 relative overflow-hidden p-8 sm:p-9">
        
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-600 to-indigo-500"></div>

        <!-- Header -->
        <div class="text-center mb-7">
          <div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-lg">
            🛡️
          </div>
          <h2 class="text-2xl font-medium tracking-tight mb-1">Admin access</h2>
          <p class="text-xs text-slate-500 dark:text-[#8A8A9E]">
            secure dashboard for question management
          </p>
        </div>

        <!-- Error Message -->
        <div id="errorBox" class="hidden mb-5 bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 text-red-600 dark:text-red-400 px-4 py-2.5 rounded-xl text-xs font-medium flex items-center gap-2">
          <span class="text-base">⚠️</span>
          <span>Invalid username or password</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
          
          <div>
            <label for="adminUser" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5 tracking-wide">
              USERNAME
            </label>
            <input type="text" id="adminUser" placeholder="admin" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-[#2A2A37] bg-white dark:bg-[#1E1E2A] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:border-blue-400 dark:focus:border-blue-600 transition-all duration-200 text-sm">
          </div>

          <div>
            <label for="adminPass" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5 tracking-wide">
              PASSWORD
            </label>
            <input type="password" id="adminPass" placeholder="········" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-[#2A2A37] bg-white dark:bg-[#1E1E2A] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:border-blue-400 dark:focus:border-blue-600 transition-all duration-200 text-sm">
          </div>

          <button type="submit" class="w-full mt-3 px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium shadow-md hover:shadow-lg transform hover:-translate-y-0.5 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 text-sm group">
            sign in <span class="text-lg group-hover:translate-x-1 transition">→</span>
          </button>
        </form>
        
        <!-- Footer note -->
        <p class="text-center text-xs text-slate-400 dark:text-[#6B6B80] mt-6">
          authorized personnel only
        </p>
      </div>
    </div>
  </main>

  <!-- Minimal footer -->
  <footer class="w-full border-t border-slate-200/60 dark:border-[#2A2A37]/80 py-5 text-center text-slate-400 dark:text-[#6B6B80] text-xs">
    <p>© 2026 aptitude portal · admin interface</p>
  </footer>

  <script>
    // Setup Theme & Animations on Load
    window.addEventListener('DOMContentLoaded', () => {
      // Dark Mode Logic
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Trigger Entrance Animation
      setTimeout(() => {
        document.querySelector('.fade-up').classList.add('visible');
      }, 50);
    });

    // Handle Login Logic
    function handleLogin(e) {
      e.preventDefault();

      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      const errorBox = document.getElementById("errorBox");

      // Default Admin Credentials
      const CORRECT_USER = "admin";
      const CORRECT_PASS = "admin123";

      if (user === CORRECT_USER && pass === CORRECT_PASS) {
        errorBox.classList.add("hidden");
        
        // Set admin session
        localStorage.setItem("adminLoggedIn", "true"); 
        
        // Add success effect
        const btn = e.target.querySelector('button[type="submit"]');
        btn.classList.add('bg-emerald-600');
        btn.innerHTML = 'redirecting <span>→</span>';
        
        // Redirect to admin dashboard
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 300);
      } else {
        // Show error with animation
        errorBox.classList.remove("hidden");
        document.getElementById("adminPass").value = "";
        
        // Shake animation
        errorBox.classList.add('shake');
        setTimeout(() => errorBox.classList.remove('shake'), 300);
        
        // Auto-hide error after 3 seconds
        setTimeout(() => {
          errorBox.classList.add("hidden");
        }, 3000);
      }
    }
  </script>

</body>
</html>
