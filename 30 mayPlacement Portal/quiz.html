<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>full mock assessment · aptitude portal</title>

  <!-- 1. Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script>
    // 2. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAyqS7iZujmdJ-Vwg5yrRfS24yW-VzG540",
      authDomain: "placement-portal-465c2.firebaseapp.com",
      projectId: "placement-portal-465c2",
      storageBucket: "placement-portal-465c2.firebasestorage.app",
      messagingSenderId: "60536248254",
      appId: "1:60536248254:web:2b4fe5996029c4712e0bef",
      measurementId: "G-F1T6X08PZ7"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    if (!localStorage.getItem("username")) window.location.href = "login.html";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          fontFamily: { sans: ['Inter', 'sans-serif'] }, 
          colors: { 
            deep: { 950: '#0B0B12', 900: '#13131C', 800: '#1E1E2A' },
            brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
          },
        } 
      }
    }
  </script>

  <style>
    .bg-grid-pattern { background-image: radial-gradient(rgba(147, 51, 234, 0.15) 1px, transparent 1px); background-size: 32px 32px; }
    .dark body { background-color: #0B0B12; }
    .dark .bg-white { background-color: #16161F !important; }
    .dark .border-slate-200 { border-color: #2A2A37 !important; }
    .option-btn { transition: all 0.2s ease; cursor: pointer; }
    .palette-item { transition: all 0.2s ease; cursor: pointer; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    
    .timer-warning {
      animation: timerPulse 1s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { background-color: #fef3c7; border-color: #f59e0b; }
      50% { background-color: #fed7aa; border-color: #ea580c; }
    }
    .dark .timer-warning {
      0%, 100% { background-color: #451a03; border-color: #f59e0b; }
      50% { background-color: #7c2d12; border-color: #ea580c; }
    }
  </style>
</head>

<body class="bg-soft-50 dark:bg-[#0B0B12] text-slate-900 dark:text-slate-200 min-h-screen flex flex-col relative">

  <div class="absolute inset-0 z-[-1] bg-grid-pattern pointer-events-none"></div>
  <div class="fixed top-20 -left-20 w-80 h-80 bg-purple-200/30 dark:bg-purple-800/20 rounded-full blur-[120px] z-[-1] animate-float"></div>
  <div class="fixed bottom-20 -right-20 w-96 h-96 bg-indigo-200/30 dark:bg-indigo-800/20 rounded-full blur-[140px] z-[-1]" style="animation-delay: -3s;"></div>

  <nav class="sticky top-4 z-50 max-w-7xl mx-auto w-[calc(100%-2.5rem)] px-5 py-3 rounded-2xl bg-white/70 dark:bg-[#16161F]/80 backdrop-blur-xl border border-white/30 dark:border-[#2A2A37]/80 shadow-sm">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3 truncate">
        <div class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-pulse"></div>
        <span id="testTitleDisplay" class="text-sm font-semibold text-slate-600 dark:text-slate-300 truncate max-w-[180px] sm:max-w-md">Full Mock Assessment</span>
      </div>
      <div class="flex items-center gap-3">
        <div id="timerContainer" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/30">
          <span class="text-amber-600 dark:text-amber-400 text-sm">⏱️</span>
          <span id="timer" class="text-amber-700 dark:text-amber-400 font-mono font-bold text-lg">00:00</span>
        </div>
        <button onclick="quitQuiz()" class="text-xs text-slate-400 hover:text-red-500 transition-colors flex items-center gap-1">
          <span>🚪</span> quit
        </button>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-5">
    <aside class="bg-white/60 dark:bg-[#16161F]/70 border border-slate-200/60 dark:border-[#2A2A37]/80 rounded-3xl p-5 h-fit lg:sticky lg:top-[100px] backdrop-blur-sm">
      <div class="mb-5 pb-4 border-b border-slate-200/60 dark:border-[#2A2A37]/80">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Mock Progress</span>
          <span id="progressStats" class="text-sm font-bold text-purple-600 dark:text-purple-400">0/0</span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-gradient-to-r from-purple-500 to-indigo-500 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
      
      <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-3">Question Palette</p>
      <div id="paletteGrid" class="grid grid-cols-5 gap-2 max-h-[320px] overflow-y-auto custom-scrollbar pr-1"></div>
      
      <div class="flex gap-2 mt-4 pt-3 border-t border-slate-200/60 dark:border-[#2A2A37]/80">
        <div class="flex items-center gap-1.5">
          <div class="w-4 h-4 rounded-full bg-emerald-500"></div>
          <span class="text-[10px] text-slate-500">Answered</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-4 h-4 rounded-full bg-slate-300 dark:bg-slate-600"></div>
          <span class="text-[10px] text-slate-500">Unattempted</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-4 h-4 rounded-full ring-2 ring-purple-400 bg-white dark:bg-slate-800"></div>
          <span class="text-[10px] text-slate-500">Current</span>
        </div>
      </div>
      
      <button onclick="submitFinalTest()" class="w-full mt-6 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-medium text-sm shadow-md transition-all duration-200 flex items-center justify-center gap-2 group">
        <span>📤</span> submit mock
        <span class="group-hover:translate-x-1 transition">→</span>
      </button>
    </aside>

    <section class="bg-white/60 dark:bg-[#16161F]/70 border border-slate-200/60 dark:border-[#2A2A37]/80 rounded-3xl p-6 md:p-8 flex flex-col min-h-[550px] backdrop-blur-sm">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200/60 dark:border-[#2A2A37]/80">
        <div class="flex items-center gap-3">
          <span id="subjectBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 uppercase font-bold">General</span>
          <span class="text-sm font-medium text-slate-600 dark:text-slate-300" id="qNumberDisplay">Question 1</span>
        </div>
        <button onclick="clearSelection()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors flex items-center gap-1">
          <span>🧹</span> clear
        </button>
      </div>
      
      <div class="flex-grow mb-8 overflow-y-auto max-h-[280px] custom-scrollbar pr-2">
        <h2 id="qText" class="text-xl md:text-2xl font-medium text-slate-800 dark:text-slate-100 leading-relaxed">Fetching cloud questions...</h2>
      </div>
      
      <div id="options-container" class="space-y-3 mb-8"></div>
      
      <div class="flex justify-between pt-6 border-t border-slate-200/60 dark:border-[#2A2A37]/80 gap-4">
        <button id="prevBtn" onclick="prevQuestion()" class="px-6 py-3 rounded-xl border-2 border-slate-300 dark:border-slate-600 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition-all flex items-center gap-2 group">
          <span class="group-hover:-translate-x-1 transition">←</span> previous
        </button>
        <button id="nextBtn" onclick="nextQuestion()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white text-sm font-medium shadow-md transition-all flex items-center gap-2 group">
          <span id="nextBtnText">save & next</span>
          <span class="group-hover:translate-x-1 transition">→</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    async function fetchQuestionsFromCloud() {
      const activeTestId = localStorage.getItem("currentTestId");
      if (!activeTestId) return [];
      try {
        const snapshot = await db.collection("questions")
          .where("testId", "==", activeTestId)
          .get();
        return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } catch (error) {
        console.error("Cloud Error:", error);
        throw error;
      }
    }

    let currentIdx = 0, questions = [], userAnswers = [], timerInterval;
    let testTimeSeconds = 0;

    window.onload = async () => {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      const testId = localStorage.getItem("currentTestId");
      const testTitle = localStorage.getItem("currentTestTitle") || "Full Mock";
      document.getElementById('testTitleDisplay').innerText = testTitle;
      if (!testId) { 
        window.location.href = "full-mocks.html"; 
        return;
      }
      
      await loadTestQuestions();
      
      testTimeSeconds = parseInt(localStorage.getItem("currentTestTime") || 120) * 60;
      startTimer(testTimeSeconds);
    };

    async function loadTestQuestions() {
      try {
        questions = await fetchQuestionsFromCloud(); 
        if (!questions || questions.length === 0) {
          document.getElementById('qText').innerHTML = "⚠️ No questions found for this mock in the cloud.";
          document.getElementById('options-container').innerHTML = '';
          return;
        }
        userAnswers = new Array(questions.length).fill(null);
        
        const testId = localStorage.getItem("currentTestId");
        const savedAnswers = sessionStorage.getItem(`mock_answers_${testId}`);
        if (savedAnswers) {
          const parsed = JSON.parse(savedAnswers);
          if (parsed.length === questions.length) {
            userAnswers = parsed;
          }
        }
        
        buildPalette();
        loadQuestion();
      } catch (e) { 
        console.error(e);
        document.getElementById('qText').innerHTML = "❌ Connection Error.";
        document.getElementById('options-container').innerHTML = '';
      }
    }

    function buildPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = questions.map((_, i) => `
        <button id="pal-${i}" onclick="jumpToQuestion(${i})" 
          class="palette-item w-10 h-10 rounded-full flex items-center justify-center font-medium text-xs border-2 transition-all duration-200 bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-400 hover:scale-105">
          ${i + 1}
        </button>
      `).join('');
    }

    function loadQuestion() {
      const q = questions[currentIdx];
      if (!q) return;
      
      document.getElementById('qNumberDisplay').innerHTML = `Question ${currentIdx + 1} <span class="text-slate-400 font-normal">/ ${questions.length}</span>`;
      document.getElementById('subjectBadge').innerHTML = q.subject || "General";
      document.getElementById('qText').innerHTML = q.text;
      
      const prevBtn = document.getElementById('prevBtn');
      if (prevBtn) prevBtn.style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
      
      const nextBtnText = document.getElementById('nextBtnText');
      if (nextBtnText) nextBtnText.innerText = currentIdx === questions.length - 1 ? "finish mock" : "save & next";

      const optCont = document.getElementById('options-container');
      optCont.innerHTML = q.options.map((opt, i) => {
        const isSelected = userAnswers[currentIdx] === i;
        const letter = String.fromCharCode(65 + i);
        return `
          <button onclick="selectOption(${i})" 
            class="option-btn w-full text-left p-4 rounded-xl font-medium flex items-center gap-4 transition-all duration-200 ${isSelected ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20 ring-2 ring-purple-200 dark:ring-purple-800' : 'border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 hover:border-purple-300 dark:hover:border-purple-600'}">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${isSelected ? 'bg-purple-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'}">
              ${letter}
            </div>
            <span class="flex-grow text-slate-700 dark:text-slate-200">${opt}</span>
            ${isSelected ? '<span class="text-purple-600 dark:text-purple-400 text-sm">✓ selected</span>' : ''}
          </button>
        `;
      }).join('');
      
      updatePaletteUI();
    }

    function selectOption(i) { 
      userAnswers[currentIdx] = i; 
      const testId = localStorage.getItem("currentTestId");
      sessionStorage.setItem(`mock_answers_${testId}`, JSON.stringify(userAnswers));
      loadQuestion(); 
    }
    
    function clearSelection() { 
      userAnswers[currentIdx] = null; 
      const testId = localStorage.getItem("currentTestId");
      sessionStorage.setItem(`mock_answers_${testId}`, JSON.stringify(userAnswers));
      loadQuestion(); 
    }
    
    function nextQuestion() { 
      if (currentIdx < questions.length - 1) { 
        currentIdx++; 
        loadQuestion(); 
      } else { 
        submitFinalTest(); 
      } 
    }
    
    function prevQuestion() { 
      if (currentIdx > 0) { 
        currentIdx--; 
        loadQuestion(); 
      } 
    }
    
    function jumpToQuestion(i) { 
      currentIdx = i; 
      loadQuestion(); 
    }

    function updatePaletteUI() {
      questions.forEach((_, i) => {
        const btn = document.getElementById(`pal-${i}`);
        if (!btn) return;
        const isAnswered = userAnswers[i] !== null;
        const isCurrent = i === currentIdx;
        
        btn.className = `palette-item w-10 h-10 rounded-full flex items-center justify-center font-medium text-xs border-2 transition-all duration-200 ${isAnswered ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-400'} ${isCurrent ? 'ring-4 ring-purple-300 dark:ring-purple-700 scale-105' : ''} hover:scale-105`;
      });
      
      const answeredCount = userAnswers.filter(a => a !== null).length;
      const total = questions.length;
      document.getElementById('progressStats').innerHTML = `${answeredCount}/${total}`;
      document.getElementById('progressBar').style.width = `${(answeredCount / total) * 100}%`;
    }

    function startTimer(seconds) {
      const timerElement = document.getElementById('timer');
      const timerContainer = document.getElementById('timerContainer');
      
      timerInterval = setInterval(() => {
        if (seconds <= 0) {
          clearInterval(timerInterval);
          timerElement.innerText = "00:00";
          if (timerContainer) timerContainer.classList.add('timer-warning');
          calculateAndFinish();
          return;
        }
        
        seconds--;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        if (seconds < 60 && timerContainer) {
          timerContainer.classList.add('timer-warning');
        } else if (timerContainer) {
          timerContainer.classList.remove('timer-warning');
        }
        
        localStorage.setItem("remainingTime", seconds);
      }, 1000);
    }

    function submitFinalTest() { 
      if (confirm("Are you sure you want to submit this full mock assessment? You cannot change your answers after submission.")) {
        calculateAndFinish(); 
      } 
    }

    async function calculateAndFinish() {
      if (timerInterval) clearInterval(timerInterval);
      
      let score = 0;
      questions.forEach((q, i) => { 
        if (userAnswers[i] === q.correct) score++; 
      });
      
      const percentage = Math.round((score / questions.length) * 100);
      
      try {
        await db.collection("results").add({
          username: localStorage.getItem("username"),
          testTitle: localStorage.getItem("currentTestTitle"),
          score: score,
          total: questions.length,
          percentage: percentage,
          type: "fullmock",
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) { 
        console.error("Cloud Save Error:", e); 
      }

      localStorage.setItem('lastScore', score);
      localStorage.setItem('totalQs', questions.length);
      localStorage.setItem('lastTestTitle', localStorage.getItem("currentTestTitle"));
      
      const testId = localStorage.getItem("currentTestId");
      sessionStorage.removeItem(`mock_answers_${testId}`);
      localStorage.removeItem("remainingTime");
      
      window.location.href = "result.html";
    }

    // FIXED: quitQuiz function now properly redirects to full-mocks page
    function quitQuiz() { 
      if (confirm("Quit mock? Your progress for this test will be lost.")) {
        if (timerInterval) clearInterval(timerInterval);
        
        // Clear stored data for this test
        const testId = localStorage.getItem("currentTestId");
        sessionStorage.removeItem(`mock_answers_${testId}`);
        localStorage.removeItem("remainingTime");
        localStorage.removeItem("currentTestId");
        localStorage.removeItem("currentTestTime");
        localStorage.removeItem("currentTestTitle");
        localStorage.removeItem("currentCompany");
        localStorage.removeItem("currentSection");
        
        // Redirect to full mocks page
        window.location.href = "full-mocks.html";
      } 
    }
  </script>
</body>
</html>
